[build]
command = "npm run build"
publish = "frontend community/project/dist"
functions = "community project/netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
